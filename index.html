<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="NTL Mars Colony"><meta property="og:description" content="Every @ntlevel follower gets a capsule on Mars. Find your colonist.">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
</head><body>
<title>NTL Mars Colony</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen live map of the colony, with a status bar on top, a find bar at the bottom and a sheet for the selected capsule. One deliberate look: daylight on Mars. */
:root {
  --sand: #c9773f;       /* ground, also page background behind the map */
  --panel: #f6ecdf;      /* cream glass panels */
  --ink: #2a1a12;        /* text on panels */
  --muted: #7d6656;      /* labels */
  --rust: #d4562a;       /* accent: actions, the founder */
  --gold: #e8b33a;       /* founder gold */
  --line: rgba(42, 26, 18, .12);
  --f-display: "Oxanium", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sand); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#map { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; left: 0; right: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; }
.ui > * { pointer-events: auto; }
.top { top: 0; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 0; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.panel { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 14px; box-shadow: 0 6px 24px rgba(60, 25, 8, .18); }
.brand { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 999px; }
.planet { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f3a06a, var(--rust) 55%, #7b2a10); box-shadow: inset -3px -2px 0 rgba(0,0,0,.18); flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; letter-spacing: .2em; font-size: 15px; text-transform: uppercase; white-space: nowrap; }
.stats { display: flex; gap: 8px; }
.stat { padding: 8px 14px; min-width: 84px; }
.stat small { display: block; font-family: var(--f-data); font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.stat span { font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.bottom { bottom: 0; padding-block: 0 calc(14px + env(safe-area-inset-bottom, 0px)); flex-direction: column; align-items: stretch; max-width: 620px; margin: 0 auto; }
.find { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 999px; }
.find label { font-family: var(--f-data); font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--rust); white-space: nowrap; }
.find input { flex: 1; min-width: 0; border: 0; background: transparent; font: 600 15px var(--f-body); color: var(--ink); padding: 10px 4px; outline: none; }
.find input::placeholder { color: var(--muted); font-weight: 400; }
button { font: 700 15px var(--f-body); border: 0; cursor: pointer; border-radius: 999px; padding: 11px 20px; background: var(--rust); color: #fff8f2; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--ink); padding: 8px 12px; font-weight: 600; }
.sheet { padding: 16px 18px; display: grid; gap: 10px; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.sheet h2 { margin: 0; font: 800 22px/1.1 var(--f-display); text-wrap: balance; }
.sheet .who { font: 600 15px var(--f-body); color: var(--muted); }
.sheet .who.claimed { color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { background: rgba(255,255,255,.55); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kv small { display: block; font: 700 10px var(--f-data); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.kv span { font: 700 16px var(--f-display); overflow-wrap: anywhere; }
.how { font-size: 13px; line-height: 1.45; color: var(--muted); margin: 0; }
.how b { color: var(--ink); }
.close { position: absolute; right: 8px; top: 8px; }
.sheet { position: relative; }
.vote { padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.vote small { font: 700 10px var(--f-data); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.chip { font: 700 13px var(--f-display); padding: 4px 10px; border-radius: 999px; color: #fff; }
.toast { font: 600 13px var(--f-body); color: var(--muted); padding: 0 6px; min-height: 18px; }
.legend { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(78px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; }
.legend button { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; background: var(--panel); color: var(--ink); box-shadow: 0 4px 14px rgba(60,25,8,.18); font-size: 18px; }
@media (max-width: 520px) {
  .stat { min-width: 0; padding: 6px 10px; }
  .stat span { font-size: 18px; }
  .brand b { font-size: 13px; letter-spacing: .14em; }
  .legend { top: calc(126px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="map" aria-label="3D map of the Mars colony"></canvas>

<div class="ui top">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- COLONY STATE (updated by Claude each day; edit only this block) ----------
const COLONY = {
  day: 1,
  founder: "@ntlevel",
  instagram: "https://www.instagram.com/ntlevel/",
  // one entry per capsule, in build order; user/country stay null until a follower claims it in the comments
  colonists: Array.from({ length: 28 }, (_, i) => ({ n: i + 1, user: null, country: null, day: 0 })),
  buildings: [],                                   // e.g. { type: "greenhouse", day: 1 }
  ideas: [null, null, null]                        // the 3 most liked ideas from the comments, e.g. "Greenhouse"
};
// -------------------------------------------------------------------------------------

const DEG = Math.PI / 180, RINGS = [0.75, 1.5, 2.25], ZMID = [1.12, 1.87];
const PCOL = ["#f25a33", "#4088ff", "#ffbf26", "#59d966", "#bf66f2", "#33d9d9"];
const slot = (r, a) => ({ a, r, x: r * Math.cos(a), z: r * Math.sin(a) });
const S1 = [], S2 = [];
for (let k = 0; k < 8; k++) for (const sg of [-1, 1]) { const c = (22.5 + 45 * k) * DEG; S1.push(slot(ZMID[0], c + sg * 10 * DEG)); S2.push(slot(ZMID[1], c + sg * 12 * DEG)); }
const PADA = 202.5 * DEG, GHA = 34.5 * DEG, DRA = 55.5 * DEG;
const angd = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
const S2free = S2.filter(q => angd(q.a, PADA) > 20 * DEG).sort((p, q) => angd(q.a, 45 * DEG) - angd(p.a, 45 * DEG));
const SLOTS = [...S1, ...S2free];

const $ = id => document.getElementById(id);
function flag(cc) { if (!cc || cc.length !== 2) return ""; return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1A5 + c.charCodeAt(0))); }
$("sDay").textContent = COLONY.day;
$("sCol").textContent = COLONY.colonists.length;
$("sBld").textContent = COLONY.colonists.length + 1 + COLONY.buildings.length;
$("voteChips").innerHTML = "";
["#3fae5a", "#2f8fd0", "#e09a2a"].forEach((c, i) => { const s = document.createElement("span"); s.className = "chip"; s.style.background = c; s.style.marginRight = "4px"; s.textContent = COLONY.ideas[i] || ("Idea #" + (i + 1) + "?"); $("voteChips").append(s); });

const toast = m => { $("toast").textContent = m; };
if (!window.THREE) { toast("The 3D map could not load. Check your connection and reload the page."); }
else start();

function start() {
  const canvas = $("map");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#c9773f");
  scene.fog = new THREE.Fog("#c9773f", 7, 14);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 60);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.8; controls.maxDistance = 9; controls.maxPolarAngle = 1.25; controls.minPolarAngle = 0.25;
  controls.screenSpacePanning = false;

  scene.add(new THREE.HemisphereLight("#fff3e6", "#8a4a2a", 0.75));
  const sun = new THREE.DirectionalLight("#fff0dc", 0.95);
  sun.position.set(-3, 6, 2); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 0.5, far: 15 });
  sun.shadow.bias = -0.0008; scene.add(sun);

  const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide }, o));
  const mSand = M("#d0763d", { roughness: 0.95 }), mRoad = M("#efdcc6", { roughness: 0.9 }), mPlot = M("#e3c3a2", { roughness: 0.85 });
  const mWhite = M("#eeeef3", { roughness: 0.38 }), mDark = M("#3b3d46", { roughness: 0.45, metalness: 0.3 }), mWin = M("#ffd9a0", { emissive: "#ffb55e", emissiveIntensity: 0.55, roughness: 0.25 });
  const mSolar = M("#1d2c5c", { roughness: 0.25, metalness: 0.6 }), mLight = M("#fff4dc", { emissive: "#fff0c8", emissiveIntensity: 1 });
  const mGlass = M("#cfe6ff", { transparent: true, opacity: 0.28, roughness: 0.05, depthWrite: false }), mGold = M("#f2c14a", { emissive: "#e8a520", emissiveIntensity: 0.35, metalness: 0.5, roughness: 0.3 });
  const mStake = M("#e0472b", { emissive: "#c0300f", emissiveIntensity: 0.4 });
  const add = (geo, mat, parent = scene, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m; };

  // ground, roads, plots
  const ground = add(new THREE.CircleGeometry(16, 96).rotateX(-Math.PI / 2), mSand, scene, false);
  const ring = (r0, r1, y = 0.002) => add(new THREE.RingGeometry(r0, r1, 160).rotateX(-Math.PI / 2).translate(0, y, 0), mRoad, scene, false);
  add(new THREE.CircleGeometry(0.45, 80).rotateX(-Math.PI / 2).translate(0, 0.002, 0), mRoad, scene, false);
  for (const r of [...RINGS, 3.0, 3.75]) ring(r - 0.06, r + 0.06);
  for (let k = 0; k < 8; k++) { const g = new THREE.BoxGeometry(4.2, 0.004, 0.1).translate(0.45 + 2.1, 0.002, 0); g.rotateY(-k * 45 * DEG); add(g, mRoad, scene, false); }
  const rocks = new THREE.Group(); scene.add(rocks);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 160; i++) { const a = rnd() * 6.283, r = 0.9 + 5 * rnd(), x = r * Math.cos(a), z = r * Math.sin(a);
    if (RINGS.concat([3, 3.75]).some(R => Math.abs(r - R) < 0.12) || SLOTS.some(q => Math.hypot(q.x - x, q.z - z) < 0.3) || Math.abs(Math.sin(a * 4)) * r < 0.1) continue;
    const s = 0.012 + 0.02 * rnd(); const m = add(new THREE.DodecahedronGeometry(s, 0), M("#8f3f1e", { roughness: 1 }), rocks); m.position.set(x, s * 0.5, z); m.rotation.set(rnd(), rnd(), rnd()); }

  // capsule builder (same design as the videos)
  const PR = 0.165;
  function capsule(color, sc = 1, glass = false) {
    const g = new THREE.Group(), wall = glass ? mGlass : mWhite;
    add(new THREE.CylinderGeometry(PR * 1.09, PR * 1.09, 0.02, 48).translate(0, 0.01, 0), mDark, g);
    for (let q = 0; q < 8; q++) { const a = (q + 0.5) / 8 * 2 * Math.PI; add(new THREE.BoxGeometry(0.022, 0.006, 0.022).translate(PR * 1.09 * Math.cos(a), 0.01, PR * 1.09 * Math.sin(a)), mLight, g, false); }
    add(new THREE.CylinderGeometry(PR, PR, 0.013, 48, 1, true).translate(0, 0.0265, 0), glass ? mWhite : M(color, { emissive: color, emissiveIntensity: 0.2 }), g);
    add(new THREE.CylinderGeometry(PR, PR, 0.007, 48, 1, true).translate(0, 0.0365, 0), wall, g);
    add(new THREE.CylinderGeometry(PR * 0.99, PR * 0.99, 0.042, 48, 1, true).translate(0, 0.061, 0), glass ? mGlass : mWin, g, !glass);
    add(new THREE.CylinderGeometry(PR, PR, 0.014, 48, 1, true).translate(0, 0.089, 0), wall, g);
    for (let q = 0; q < 12; q++) { const a = q / 12 * 2 * Math.PI; add(new THREE.BoxGeometry(0.01, 0.044, 0.01).translate(PR * Math.cos(a), 0.061, PR * Math.sin(a)), mWhite, g); }
    const torusM = glass ? mGold : M(color, { emissive: color, emissiveIntensity: 0.3 });
    add(new THREE.TorusGeometry(PR * 1.004, 0.0045, 6, 48).rotateX(Math.PI / 2).translate(0, 0.092, 0), torusM, g);
    const dp = k => { const a = k / 16 * Math.PI / 2; return new THREE.Vector2(PR * Math.cos(a), 0.096 + 0.07 * Math.sin(a)); }, rng = (a, b) => { const o = []; for (let k = b; k >= a; k--) o.push(dp(k)); return o; };
    if (glass) {
      add(new THREE.LatheGeometry(rng(0, 16), 48), mGlass, g, false);
      for (let q = 0; q < 6; q++) { const t = new THREE.TorusGeometry(PR * 1.003, 0.0035, 6, 40, Math.PI); t.scale(1, 0.07 / PR, 1); t.rotateY(q * Math.PI / 6); t.translate(0, 0.096, 0); add(t, mWhite, g); }
      add(new THREE.CylinderGeometry(PR * 0.97, PR * 0.97, 0.004, 48).translate(0, 0.022, 0), mPlot, g);
    } else {
      add(new THREE.LatheGeometry(rng(0, 7), 48), mWhite, g);
      add(new THREE.LatheGeometry(rng(7, 11).map(v => new THREE.Vector2(v.x * 1.004, v.y + 0.0005)), 48), mSolar, g);
      add(new THREE.LatheGeometry(rng(11, 13), 48), mWhite, g);
      add(new THREE.CircleGeometry(dp(13).x, 32).rotateX(-Math.PI / 2).translate(0, dp(13).y + 0.002, 0), mWin, g);
    }
    add(new THREE.BoxGeometry(0.034, 0.088, 0.08).translate(PR + 0.006, 0.044, 0), mDark, g);
    add(new THREE.BoxGeometry(0.06, 0.006, 0.05).translate(PR + 0.05, 0.003, 0), mDark, g);
    add(new THREE.BoxGeometry(0.004, 0.066, 0.046).translate(PR + 0.024, 0.04, 0), mWhite, g);
    add(new THREE.BoxGeometry(0.004, 0.004, 0.05).translate(PR + 0.025, 0.077, 0), mLight, g, false);
    g.scale.setScalar(sc); return g;
  }
  // blocky astronaut
  function astronaut(color, gold = false) {
    const g = new THREE.Group(), u = 0.055, suit = mWhite, pack = M("#8c929e");
    const b = (w, h, d, x, y, z, m) => add(new THREE.BoxGeometry(w * u, h * u, d * u).translate(x * u, y * u, z * u), m, g);
    b(.45, .9, .5, -.27, .45, 0, suit); b(.45, .9, .5, .27, .45, 0, suit); b(1.1, 1.1, .7, 0, 1.45, 0, suit);
    b(.3, 1, .35, -.72, 1.4, 0, suit); b(.3, 1, .35, .72, 1.4, 0, suit); b(.95, .9, .95, 0, 2.5, 0, suit);
    b(.9, 1, .35, 0, 1.5, -.52, pack);
    b(.75, .5, .06, 0, 2.5, .49, gold ? mGold : M("#e09a2a", { emissive: "#d08010", emissiveIntensity: 0.35, metalness: 0.7, roughness: 0.2 }));
    b(1.12, .22, .72, 0, 1.6, 0, gold ? mGold : M(color, { emissive: color, emissiveIntensity: 0.25 }));
    return g;
  }

  const pickables = [], people = [];
  const homes = COLONY.colonists.map((c, i) => {
    const s = SLOTS[i]; if (!s) return null;
    const plot = add(new THREE.BoxGeometry(0.42, 0.008, 0.42).translate(0, 0.004, 0), mPlot, scene, false); plot.position.set(s.x, 0, s.z); plot.rotation.y = -s.a;
    const col = PCOL[i % 6], cap = capsule(col); cap.position.set(s.x, 0, s.z); cap.rotation.y = -s.a; scene.add(cap);
    const man = astronaut(col); const ox = Math.cos(s.a), oz = Math.sin(s.a);
    man.position.set(s.x + 0.25 * ox + 0.1 * oz, 0, s.z + 0.25 * oz - 0.1 * ox); man.rotation.y = Math.atan2(ox, oz); scene.add(man); people.push({ man, base: man.rotation.y, ph: i * 1.7 });
    cap.traverse(o => { if (o.isMesh) { o.userData.home = i; pickables.push(o); } });
    return { c, s, cap, col };
  }).filter(Boolean);
  // next free plot with stakes
  const nx = SLOTS[COLONY.colonists.length];
  if (nx) { const plot = add(new THREE.BoxGeometry(0.42, 0.008, 0.42).translate(0, 0.004, 0), mPlot, scene, false); plot.position.set(nx.x, 0, nx.z); plot.rotation.y = -nx.a;
    for (let q = 0; q < 4; q++) { const a = q * Math.PI / 2 + Math.PI / 4; add(new THREE.BoxGeometry(0.03, 0.08, 0.03).translate(nx.x + 0.17 * Math.cos(a), 0.04, nx.z + 0.17 * Math.sin(a)), mStake); } }
  // three idea plots (top-3 ideas from the comments get built here)
  [12, 23, 34].forEach((d, i) => { const x = 2.62 * Math.cos(d * DEG), z = 2.62 * Math.sin(d * DEG), c = ["#59e07f", "#4cc8ff", "#ffbf40"][i];
    const p = add(new THREE.BoxGeometry(0.42, 0.008, 0.42).translate(0, 0.004, 0), mPlot, scene, false); p.position.set(x, 0, z); p.rotation.y = -d * DEG;
    if (!COLONY.ideas[i]) add(new THREE.CylinderGeometry(0.11, 0.11, 0.32, 32, 1, true).translate(x, 0.16, z), M(c, { transparent: true, opacity: 0.35, emissive: c, emissiveIntensity: 0.8, depthWrite: false }), scene, false); });
  // founder's glass house
  const fh = capsule("#ffffff", 1.9, true); fh.rotation.y = -Math.PI / 2; scene.add(fh);
  fh.traverse(o => { if (o.isMesh) { o.userData.home = -1; pickables.push(o); } });
  const founder = astronaut("#f2c14a", true); founder.scale.setScalar(1.25); founder.position.set(0.02, 0.024 * 1.9, 0.02); scene.add(founder);
  // landing pad + ship
  const SP = new THREE.Vector3(ZMID[1] * Math.cos(PADA), 0, ZMID[1] * Math.sin(PADA));
  add(new THREE.CylinderGeometry(0.31, 0.31, 0.012, 64).translate(SP.x, 0.006, SP.z), mDark);
  add(new THREE.TorusGeometry(0.22, 0.006, 6, 64).rotateX(Math.PI / 2).translate(SP.x, 0.013, SP.z), M("#ffbf26", { emissive: "#ffaa10", emissiveIntensity: 0.5 }), scene, false);
  const ship = new THREE.Group(); ship.position.copy(SP); ship.rotation.y = Math.atan2(-Math.cos(PADA), -Math.sin(PADA)); scene.add(ship);
  add(new THREE.LatheGeometry([[0, .575], [.02, .565], [.05, .52], [.072, .45], [.08, .38], [.08, .1], [.075, .07], [0, .07]].map(p => new THREE.Vector2(p[0], p[1])), 48), mWhite, ship);
  add(new THREE.CylinderGeometry(.0805, .0805, .025, 48, 1, true).translate(0, .3025, 0), mDark, ship);
  add(new THREE.CylinderGeometry(.028, .05, .037, 32).translate(0, .053, 0), mDark, ship);
  add(new THREE.BoxGeometry(.044, .07, .006).translate(0, .11, .08), mDark, ship);
  for (let q = 0; q < 4; q++) { const a = q / 4 * 2 * Math.PI + Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    add(new THREE.BoxGeometry(.014, .1, .014).translate(.12 * c, .05, .12 * s), mWhite, ship); add(new THREE.BoxGeometry(.03, .006, .03).translate(.12 * c, .003, .12 * s), mWhite, ship);
    const fin = add(new THREE.BoxGeometry(.05, .12, .006), mDark, ship); fin.position.set(.09 * c, .14, .09 * s); fin.rotation.y = -a + Math.PI / 2; }

  // selection highlight
  const halo = add(new THREE.RingGeometry(0.24, 0.27, 64).rotateX(-Math.PI / 2), M("#ffffff", { emissive: "#ffd36a", emissiveIntensity: 1 }), scene, false); halo.visible = false;

  // camera framing
  const view = { target: new THREE.Vector3(), dist: 6.2 };
  const DIR = new THREE.Vector3(1, 1.05, 1).normalize();
  let fly = null;
  function frame(tgt, dist, instant = false) {
    const pos = tgt.clone().add(DIR.clone().multiplyScalar(dist));
    if (instant || matchMedia("(prefers-reduced-motion: reduce)").matches) { controls.target.copy(tgt); camera.position.copy(pos); return; }
    fly = { t: 0, ft: controls.target.clone(), fp: camera.position.clone(), tt: tgt, tp: pos };
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    view.dist = (w / h < 0.8 ? 8.6 : 6.2);
  }
  resize(); window.addEventListener("resize", resize);
  frame(new THREE.Vector3(0, 0, 0), view.dist, true);

  // selection sheet
  function select(i) {
    const sh = $("sheet");
    if (i === -1) {
      halo.visible = true; halo.scale.setScalar(1.9 * 1.2); halo.position.set(0, 0.012, 0);
      $("cSw").style.background = "var(--gold)"; $("cTitle").textContent = "Founder's House";
      $("cWho").textContent = COLONY.founder; $("cWho").className = "who claimed";
      $("cNum").textContent = "★"; $("cCountry").textContent = "—"; $("cDay").textContent = "Day 0";
      $("cHow").innerHTML = 'The glass house in the middle belongs to the channel. It is empty for now: the colony decides what goes inside.';
      frame(new THREE.Vector3(0, 0.05, 0), 1.9);
    } else {
      const h = homes[i]; if (!h) return;
      halo.visible = true; halo.scale.setScalar(1); halo.position.set(h.s.x, 0.012, h.s.z);
      $("cSw").style.background = h.col; $("cTitle").textContent = "Capsule #" + h.c.n;
      const claimed = !!h.c.user; $("cWho").textContent = claimed ? h.c.user : "Not claimed yet"; $("cWho").className = "who" + (claimed ? " claimed" : "");
      $("cNum").textContent = "#" + h.c.n; $("cCountry").textContent = h.c.country ? (flag(h.c.country) + " " + h.c.country.toUpperCase()) : "—"; $("cDay").textContent = "Day " + h.c.day;
      $("cHow").innerHTML = claimed ? "This colonist lives here. New buildings appear every day, voted in the comments." : 'Want this capsule? Follow <b>@ntlevel</b> and comment <b>COLONIST</b> with your country on the latest video.';
      frame(new THREE.Vector3(h.s.x, 0.05, h.s.z), 1.25);
    }
    sh.hidden = false; toast("");
  }
  $("bClose").onclick = () => { $("sheet").hidden = true; halo.visible = false; frame(new THREE.Vector3(), view.dist); };
  $("bHome").onclick = () => { $("sheet").hidden = true; halo.visible = false; frame(new THREE.Vector3(), view.dist); };
  $("bFounder").onclick = () => select(-1);
  $("findForm").addEventListener("submit", e => {
    e.preventDefault(); const q = $("q").value.trim().toLowerCase().replace(/^@/, ""); if (!q) { toast("Type your Instagram name or a capsule number."); return; }
    if (q === COLONY.founder.slice(1).toLowerCase()) { select(-1); return; }
    const num = q.replace(/^#/, "");
    let idx = /^\d+$/.test(num) ? homes.findIndex(h => h.c.n === +num) : homes.findIndex(h => h.c.user && h.c.user.toLowerCase().replace(/^@/, "") === q);
    if (idx < 0 && !/^\d+$/.test(num)) idx = homes.findIndex(h => h.c.user && h.c.user.toLowerCase().includes(q));
    if (idx >= 0) select(idx);
    else toast(/^\d+$/.test(num) ? "There is no capsule #" + num + " yet." : "No colonist called @" + q + " yet. New colonists are added every day; check back tomorrow.");
  });

  // tap to select
  const ray = new THREE.Raycaster(), pt = new THREE.Vector2(); let down = null;
  canvas.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const r = canvas.getBoundingClientRect(); pt.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(pt, camera); const hit = ray.intersectObjects(pickables, false)[0];
    if (hit) select(hit.object.userData.home);
  });

  // loop
  const clock = new THREE.Clock();
  (function loop() {
    const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
    if (fly) { fly.t = Math.min(1, fly.t + dt / 0.9); const k = fly.t < .5 ? 4 * fly.t ** 3 : 1 - (-2 * fly.t + 2) ** 3 / 2;
      controls.target.lerpVectors(fly.ft, fly.tt, k); camera.position.lerpVectors(fly.fp, fly.tp, k); if (fly.t >= 1) fly = null; }
    people.forEach(p => { p.man.rotation.y = p.base + 0.3 * Math.sin(t * 0.5 + p.ph); });
    founder.rotation.y = 0.8 * Math.sin(t * 0.4);
    if (halo.visible) halo.material.emissiveIntensity = 0.7 + 0.4 * Math.sin(t * 4);
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  })();
}
</script>
